name: lumoauth
repo: https://github.com/lumoauth/hermes
sha: d52e41e96f71cb9ff70053a1e887bb3a2f20e7f0
description: "Checks every tool call outside the model, against rules kept in LumoAuth, and allows it, asks a person or blocks it. Disclosure — sends each tool call's name, MCP server and risk class to your LumoAuth organization (app.lumoauth.dev or eu.app.lumoauth.dev); for calls that need approval it also sends a title and up to five argument lines (values named like secrets hidden), which LumoAuth delivers to the owner's phone app and the organization's Slack or Discord approval channels; by default it also sends an audit receipt per decision (tool name, outcome, SHA-256 of the arguments) and the model token count once a minute, both switchable off in its config.json. Every tool call is blocked after enabling until `hermes lumoauth setup` finishes, and again when LumoAuth cannot be reached for more than 5 minutes. Setup stores an agent private key under ~/.lumoauth/guard/hermes/ (shared by all Hermes profiles) and edits Hermes' config.yaml to enable the plugin and raise plugins.hook_callback_timeout unless run with --no-hermes-config."
maintainer: LumoAuth
tier: community
category: general
requires_hermes: ">=0.21.6"
docs_url: https://docs.lumoauth.dev/agents/personal-agents
version: "0.1.2"
title: LumoAuth Guard
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, post_tool_call, post_approval_response, post_api_request, on_session_start]
  provides_middleware: []
  requires_env: []
